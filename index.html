<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b8a5dd" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Hier spielt die Musik by Leni</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="screen">
    <div class="notes" aria-hidden="true">
      <span>♪</span><span>♫</span><span>♬</span><span>♪</span><span>♫</span><span>♬</span>
      <span>♫</span><span>♪</span><span>♬</span><span>♫</span>
    </div>

    <section class="card" aria-live="polite">
      <div class="mark" aria-hidden="true">♫</div>
      <h1 class="site-title"><span>HIER SPIELT</span><span>DIE MUSIK</span></h1>
      <p class="byline">by Leni</p>
      <p id="cardNumber" class="card-number">Karte wird geladen …</p>

      <button id="playButton" class="play-button" type="button" disabled>
        <span class="play-icon" aria-hidden="true">▶</span>
        <span>Song starten</span>
      </button>

      <p id="status" class="status">QR-Code öffnen, dann auf „Song starten“ tippen.</p>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
